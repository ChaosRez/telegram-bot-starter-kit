name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:8.2.11
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"quit(db.adminCommand('ping').ok ? 0 : 1)\""
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: true
      - run: go mod download
      - run: gofmt -w . && git diff --exit-code
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go test -race -tags=integration ./internal/users
        env:
          MONGODB_URI: mongodb://localhost:27017
      - uses: golang/govulncheck-action@v1
        with:
          go-package: ./...
      - run: docker build --tag telegram-bot-starter-kit:test .
